<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FemboySMP.pl | ANARCHIA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffb7c5;
            --dark-pink: #ff85a2;
            --soft-purple: #2d1b2e;
            --glass: rgba(255, 255, 255, 0.08);
            --text-muted: #d1d1d1;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #120812 0%, #050505 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .hero {
            text-align: center;
            padding: 80px 20px 40px 20px;
            z-index: 10;
        }

        .hero h1 {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 10px;
            text-shadow: 0 0 30px rgba(255, 183, 197, 0.6);
        }

        /* Sakura Particles */
        .sakura {
            position: absolute;
            background: linear-gradient(135deg, #ffb7c5, #ff85a2);
            border-radius: 100% 0 100% 0;
            opacity: 0.6;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 2;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            100% { transform: translateY(110vh) translateX(100px) rotate(720deg); opacity: 0; }
        }

        .container {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            max-width: 1400px;
            width: 98%;
            z-index: 10;
            overflow-x: auto;
            margin-bottom: 50px;
        }

        .rank-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 183, 197, 0.15);
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            transition: 0.3s ease;
            flex: 1;
            min-width: 180px;
            max-width: 250px;
        }

        .rank-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(255, 183, 197, 0.2);
            background: rgba(255, 183, 197, 0.05);
        }

        .rank-icon { font-size: 50px; margin-bottom: 10px; display: block; }
        .rank-name { font-size: 1.6rem; font-weight: 800; margin-bottom: 5px; text-transform: uppercase; }
        .price { font-size: 1.3rem; font-weight: 300; margin-bottom: 20px; display: block; color: var(--primary); }

        .buy-btn {
            background: linear-gradient(45deg, var(--primary), var(--dark-pink));
            color: var(--soft-purple);
            border: none;
            padding: 10px 0;
            border-radius: 50px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            letter-spacing: 1px;
        }

        .buy-btn:hover { filter: brightness(1.1); transform: scale(1.05); }

        /* Przycisk regulaminu w rogu */
        .rules-corner-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--glass);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: 0.3s;
        }

        .rules-corner-btn:hover {
            background: var(--primary);
            color: var(--soft-purple);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            opacity: 0.6;
            z-index: 10;
        }

        @media (max-width: 1000px) {
            .container { flex-wrap: wrap; }
            .rank-card { min-width: 250px; }
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>FemboySMP.pl</h1>
        <div style="color: var(--primary); font-weight: 600; letter-spacing: 5px; margin-top: 10px;">ANARCHIA • BEZ ZASAD</div>
    </header>

    <div class="container">
        <div class="rank-card">
            <span class="rank-icon">🫙</span>
            <div class="rank-name" style="color: #fff;">Gooner</div>
            <span class="price">5 PLN</span>
            <button class="buy-btn" onclick="pay('gooner')">Kup</button>
        </div>
        <div class="rank-card">
            <span class="rank-icon">🦊</span>
            <div class="rank-name" style="color: #fbc531;">Furas</div>
            <span class="price">10 PLN</span>
            <button class="buy-btn" onclick="pay('furas')">Kup</button>
        </div>
        <div class="rank-card">
            <span class="rank-icon">🖤</span>
            <div class="rank-name" style="color: #a29bfe;">Gotka</div>
            <span class="price">20 PLN</span>
            <button class="buy-btn" onclick="pay('gotka')">Kup</button>
        </div>
        <div class="rank-card">
            <span class="rank-icon">🔫</span>
            <div class="rank-name" style="color: #487eb0;">Kirk</div>
            <span class="price">30 PLN</span>
            <button class="buy-btn" onclick="pay('kirk')">Kup</button>
        </div>
        <div class="rank-card">
            <span class="rank-icon">🏝️</span>
            <div class="rank-name" style="color: #e84118;">Epstein</div>
            <span class="price">50 PLN</span>
            <button class="buy-btn" onclick="pay('epstein')">Kup</button>
        </div>
    </div>

    <footer>femboysmp.pl – Wszelkie prawa zastrzeżone</footer>

    <a href="regulamin.html" class="rules-corner-btn">Regulamin</a>

    <script>
        function pay(rank) {
            const stripeLinks = {
                'gooner': 'https://buy.stripe.com/00w00ifRV4hT6uJd184AU0J',
                'furas': 'https://buy.stripe.com/4gMfZggVZ29L2et0em4AU0K',
                'gotka': 'https://buy.stripe.com/3cI28qfRV6q1cT7e5c4AU0L',
                'kirk': 'https://buy.stripe.com/7sY28q0X14hT3ixaT04AU0M',
                'epstein': 'https://buy.stripe.com/7sY8wO6hl29Lf1f9OW4AU0N'
            };

            const link = stripeLinks[rank];
            if (link) {
                window.location.href = link;
            }
        }

        function createSakura() {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            sakura.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 10 + 6 + 'px';
            sakura.style.width = size;
            sakura.style.height = size;
            sakura.style.animationDuration = Math.random() * 3 + 4 + 's';
            document.body.appendChild(sakura);
            setTimeout(() => sakura.remove(), 7000);
        }
        setInterval(createSakura, 300);
    </script>
</body>
</html>
